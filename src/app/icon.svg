<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kl-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#122024" />
      <stop offset="1" stop-color="#0d4696" />
    </linearGradient>
    <linearGradient id="kl-vec" x1="20" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Rounded Clinical Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#kl-bg)" />
  <rect x="3" y="3" width="58" height="58" rx="13" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- Goniometer / Moment Arm Arc -->
  <path
    d="M 38 20 A 16 16 0 0 1 38 44"
    stroke="#60a5fa"
    stroke-opacity="0.45"
    stroke-width="2"
    stroke-dasharray="2.5 2.5"
    stroke-linecap="round"
  />

  <!-- Anatomical Spine Axis (Left Vertical Stem of K) -->
  <line x1="20" y1="15" x2="20" y2="49" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="20" cy="17" r="3" fill="#ffffff" />
  <circle cx="20" cy="47" r="3" fill="#ffffff" />

  <!-- Biomechanical Lever Vectors (Upper & Lower Diagonals of K) -->
  <path
    d="M 45 16 L 23 32 L 45 48"
    stroke="url(#kl-vec)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Vector Anchor Nodes -->
  <circle cx="45" cy="16" r="3.5" fill="#60a5fa" stroke="#122024" stroke-width="1.5" />
  <circle cx="45" cy="48" r="3.5" fill="#34d399" stroke="#122024" stroke-width="1.5" />

  <!-- Central Joint Fulcrum Pivot -->
  <circle cx="22" cy="32" r="6" fill="#0b6a51" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="22" cy="32" r="2" fill="#ffffff" />
</svg>
